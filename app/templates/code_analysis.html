{% extends "base.html" %}

{% block title %}AI Code Analysis{% endblock %}

{% block content %}
<div class="container text-white">
    <h2 class="mb-4">AI-Powered Code Analysis</h2>

    <div class="row g-4">
        <div class="col-lg-6">
            <div class="card dashboard-card h-100">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">Code Input</h5>
                    <p class="text-muted">Paste your Python function or class below.</p>
                    <div class="form-group flex-grow-1 d-flex flex-column">
                        <textarea id="code-input" class="form-control flex-grow-1" placeholder="def my_function(a, b):
    # Your code here
    return a + b"></textarea>
                    </div>
                    <div class="mt-3">
                        <button id="analyze-code-btn" class="btn btn-primary">
                            <i class="fas fa-search"></i> Analyze for Bugs
                        </button>
                        <button id="generate-tests-btn" class="btn btn-success">
                            <i class="fas fa-vial"></i> Generate Unit Tests
                        </button>
                        <button id="refactor-code-btn" class="btn btn-info">
                            <i class="fas fa-magic"></i> Refactor Code
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="card dashboard-card h-100">
                <div class="card-body d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h5 class="card-title mb-0">AI Results</h5>
                        <button id="download-analysis-pdf" class="btn btn-sm btn-danger"><i class="fas fa-file-pdf"></i> Download PDF</button>
                    </div>

                    <div id="spinner-analysis" class="d-none text-center my-3">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p class="mt-2">AI is thinking...</p>
                    </div>
                    <div id="results-output" class="flex-grow-1" style="background-color: #282c34; border-radius: 8px; padding: 1rem; overflow-y: auto;">
                        The AI's analysis will appear here.
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/analysis.js') }}"></script>
{% endblock %}
