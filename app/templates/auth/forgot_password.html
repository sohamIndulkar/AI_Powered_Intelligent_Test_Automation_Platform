{% extends "base.html" %}

{% block title %}Forgot Password{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="card auth-card">
        <div class="card-body">
            <h3 class="card-title text-center mb-4">Verify Your Identity</h3>
            <p class="text-center text-muted mb-4">Please enter your name and email to proceed.</p>
            <form method="POST" action="{{ url_for('auth.forgot_password') }}">
                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-control" name="name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email address</label>
                    <input type="email" class="form-control" name="email" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-3">Verify</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
